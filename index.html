<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Học tiếng Trung — Kho từ vựng &amp; Luyện tập</title>
    <meta name="description" content="Kho từ vựng, ngữ pháp HSK1–HSK2 và luyện tập tiếng Trung dành cho người Việt.">
    <meta name="theme-color" content="#1c262b">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>汉</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Noto+Sans+SC:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5/dist/hanzi-writer.min.js"></script>
</head>
<body>

    <header class="app-header">
        <div class="app-logo" aria-hidden="true">汉</div>
        <div>
            <h1>Học tiếng Trung</h1>
            <p class="app-subtitle" id="app-subtitle">Kho từ vựng, ngữ pháp &amp; luyện tập</p>
        </div>
    </header>

    <nav class="mode-switch" id="top-mode-switch">
        <a class="mode-btn" data-mode="tu-vung" href="#tu-vung">📚 Từ vựng</a>
        <a class="mode-btn" data-mode="ngu-phap" href="#ngu-phap">📖 Ngữ pháp</a>
        <a class="mode-btn" data-mode="luyen-tap" href="#luyen-tap">🎯 Luyện tập</a>
    </nav>

    <!-- ===== KHO TỪ VỰNG ===== -->
    <main id="view-tu-vung" class="view" hidden>
        <div class="game-board board-left">
            <div class="search-box">
                <span aria-hidden="true">🔍</span>
                <input id="tv-tim" type="search" placeholder="Tìm chữ Hán, pinyin (nihao), nghĩa hoặc Hán Việt…" autocomplete="off">
            </div>
            <div class="chip-row" id="tv-cap-do"></div>
            <div class="filter-row">
                <select id="tv-bai" aria-label="Lọc theo bài"></select>
                <select id="tv-chu-de" aria-label="Lọc theo chủ đề"></select>
                <div class="view-toggle" role="group" aria-label="Kiểu hiển thị">
                    <button type="button" data-kieu="danh-sach" class="active" title="Danh sách">☰</button>
                    <button type="button" data-kieu="the" title="Thẻ lật">▦</button>
                </div>
            </div>
            <p class="result-count" id="tv-dem"></p>
            <div id="tv-ket-qua"></div>
        </div>
    </main>

    <!-- ===== NGỮ PHÁP ===== -->
    <main id="view-ngu-phap" class="view" hidden>
        <div class="game-board board-left">
            <div class="search-box">
                <span aria-hidden="true">🔍</span>
                <input id="np-tim" type="search" placeholder="Tìm điểm ngữ pháp: 了, 比, so sánh, đang…" autocomplete="off">
            </div>
            <div class="chip-row" id="np-cap-do"></div>
            <div id="np-ket-qua"></div>
        </div>
    </main>

    <!-- ===== LUYỆN TẬP ===== -->
    <main id="view-luyen-tap" class="view" hidden>
        <div class="mode-switch sub-mode-switch" id="sub-mode-switch">
            <button class="mode-btn sub-active" data-submode="write">✍️ Viết chữ</button>
            <button class="mode-btn" data-submode="quiz">🎯 Trắc nghiệm</button>
        </div>
        <div class="chip-row chip-row-center" id="lt-cap-do"></div>

        <div id="write-mode">
            <div class="game-board">
                <div class="progress-wrap">
                    <div class="progress-text"><strong id="progress-count">0</strong> / <span id="progress-total">0</span> từ đã luyện</div>
                    <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
                </div>
                <h2>Hãy viết từ:<br><span id="viet-word">...</span></h2>
                <div id="canvas-wrapper"></div>
                <div id="effect-message">Dùng ngón tay/chuột để viết nét chữ!</div>
                <div class="actions">
                    <button class="btn-skill" onclick="dungGoiY()"><span aria-hidden="true">💡</span> Tham khảo</button>
                    <button class="btn-next" onclick="tuTiepTheo()">Câu tiếp theo <span aria-hidden="true">→</span></button>
                </div>
            </div>
        </div>

        <div id="quiz-mode" hidden>
            <div class="game-board">
                <div class="progress-wrap">
                    <div class="progress-text">Điểm: <strong id="quiz-score">0</strong> / <span id="quiz-total">0</span></div>
                </div>
                <div class="chip-row chip-row-center" id="quiz-huong">
                    <button type="button" class="chip active" data-huong="viet-han">Nghĩa → Chữ Hán</button>
                    <button type="button" class="chip" data-huong="han-viet">Chữ Hán → Nghĩa</button>
                </div>
                <h2 id="quiz-de">Từ nào có nghĩa là:</h2>
                <span id="quiz-question">...</span>
                <div class="quiz-options" id="quiz-options"></div>
                <div id="quiz-message"></div>
                <div class="actions">
                    <button class="btn-next" onclick="cauHoiTiepTheo()">Câu tiếp theo <span aria-hidden="true">→</span></button>
                </div>
            </div>
        </div>
    </main>

    <!-- ===== CỬA SỔ CHI TIẾT TỪ ===== -->
    <div class="modal-backdrop" id="chi-tiet" hidden>
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="ct-hanzi">
            <div class="modal-nav">
                <button type="button" class="icon-btn" id="ct-truoc" title="Từ trước (←)">‹</button>
                <button type="button" class="icon-btn" id="ct-sau" title="Từ sau (→)">›</button>
                <button type="button" class="icon-btn" id="ct-dong" title="Đóng (Esc)">✕</button>
            </div>
            <div id="ct-noi-dung"></div>
        </div>
    </div>

    <div class="toast" id="toast" hidden></div>

    <p class="app-footer">Dữ liệu: Giáo trình chuẩn HSK1 · danh sách từ HSK2 · Viết chữ với HanziWriter.js</p>

    <!--
        THỨ TỰ NẠP FILE:
        1. js/kho.js         — tạo kho dữ liệu chung
        2. data/...          — dữ liệu. Thêm file mới (ví dụ data/tu-vung/hsk3.js) thì thêm 1 dòng <script> ở đây.
        3. js/...            — giao diện
    -->
    <script src="js/kho.js"></script>

    <script src="data/tu-vung/hsk1.js"></script>
    <script src="data/tu-vung/hsk2.js"></script>
    <script src="data/tu-vung/mo-rong.js"></script>
    <script src="data/ngu-phap/hsk1.js"></script>
    <script src="data/ngu-phap/hsk2.js"></script>

    <script src="js/tien-ich.js"></script>
    <script src="js/tu-vung.js"></script>
    <script src="js/ngu-phap.js"></script>
    <script src="js/luyen-tap.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
